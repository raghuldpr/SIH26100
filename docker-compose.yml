services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26100-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26100-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
